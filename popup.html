<!DOCTYPE html>
<html style="width: 320px; padding: 10px; font-family: Arial, sans-serif;">
<head>
  <meta charset="UTF-8">
  <style>
    .hidden { display: none !important; }
    input, select, textarea, button { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
    .btn { background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-danger { background: #dc3545; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
    .btn-artigo { background: #e2e8f0; border: 1px solid #cbd5e1; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; margin-right: 4px; margin-bottom: 4px;}
    .btn-vide { background: #fef9c3; border-color: #ca8a04; color: #78350f; font-style: italic; }
    .lei-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 5px; padding-bottom: 5px; border-bottom: 1px solid #eee; }
    
    /* Abas */
    #abas { display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 5px; }
    .aba-btn { flex: 1; padding: 5px; background: none; border: none; cursor: pointer; font-size: 12px; color: #555; }
    .aba-btn.ativa { font-weight: bold; color: #0056b3; border-bottom: 2px solid #0056b3; margin-bottom: -7px; }
    
    /* Índice */
    .letra-btn { padding: 4px 6px; font-size: 12px; border: 1px solid #ddd; background: #fff; cursor: pointer; border-radius: 3px; }
    .letra-btn:hover { background: #f0f0f0; }
    .resultado-item { border: 1px solid #eee; padding: 8px; border-radius: 4px; margin-bottom: 8px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="abas">
    <button class="aba-btn ativa" data-alvo="tela-busca">Busca Rápida</button>
    <button class="aba-btn" data-alvo="tela-indice">Índice</button>
    <button class="aba-btn" data-alvo="tela-gerenciar">Gerenciar</button>
  </div>

  <div id="tela-busca" class="tela">
    <select id="lei"></select>
    <input type="text" id="artigo" placeholder="Nº do Artigo (ex: 121)">
    <button id="buscar" class="btn">Ir para o Artigo</button>
  </div>

  <div id="tela-indice" class="tela hidden">
    <div style="display:flex; gap:4px; margin-bottom:10px;">
      <input type="text" id="busca-termo" placeholder='Palavra (ex: Sursis) ou "frase exata"' style="margin-bottom:0; flex:1; min-width:0;">
      <button id="btn-buscar-indice" class="btn" style="width:auto; white-space:nowrap; margin-bottom:0; padding:8px 10px;">Buscar</button>
    </div>
    <div id="letras-az" style="display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px;"></div>
    <div id="resultados-indice" style="max-height: 250px; overflow-y: auto;">
      <div style="text-align: center; font-size: 12px; color: #777; margin-top: 20px;">Use a busca ou clique em uma letra.</div>
    </div>
  </div>

  <div id="tela-gerenciar" class="tela hidden">
    <input type="text" id="nova-sigla" placeholder="Sigla (ex: LJE)">
    <input type="text" id="novo-nome" placeholder="Nome (ex: Lei dos Juizados)">
    <input type="text" id="nova-url" placeholder="URL Compilada do Planalto">
    <input type="number" id="novo-limite" placeholder="Último Artigo (Opcional)">
    <button id="adicionar-lei" class="btn" style="background: #28a745;">Adicionar Lei</button>
    
    <div style="max-height: 120px; overflow-y: auto; margin-bottom: 15px; border-bottom: 1px solid #eee;" id="lista-leis"></div>
    
    <div class="hidden">
      <h4 style="margin: 0 0 5px 0; font-size: 13px;">Importar Índice (JSON)</h4>
      <textarea id="json-import" rows="3" placeholder='[{"termo": "Pena", "etiqueta": "CP", "lei": "CP", "artigos": ["46"]}]'></textarea>
      <button id="btn-importar" class="btn" style="background: #6c757d; font-size: 12px;">Importar Dados da IA</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
